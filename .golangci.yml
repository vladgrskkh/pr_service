version: "2"

run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1

formatters:
  enable:
    - goimports
    - gofmt 

linters:
  enable:
    - govet        
    - staticcheck  
    - errcheck     
    - unused       
    - gocritic     
    - gosec        
    - dupl         
    - misspell     
    - errname
    - sloglint  

  disable:
    - funlen     
version: "2"

run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1
  skip-dirs:
    - "vendor"

formatters:
  enable:
    - goimports
    - gofmt 

linters:
  enable:
    - govet        
    - staticcheck  
    - errcheck     
    - unused       
    - gocritic     
    - gosec        
    - dupl         
    - misspell     
    - errname
    - sloglint  

  disable:
    - funlen     

linters-settings:
  errcheck:
    ignore: ["Close", "Write", "Print"]
  dupl:
    threshold: 100
  gosec:
    exclude:
      - "G104"

issues:
  exclude-use-default: false
  exclude:
    - "_test.go"
    - "generated"

output:
  format: colored-line-number
